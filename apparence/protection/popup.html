<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src chrome:; img-src chrome: data:; object-src 'none'">
<link rel="stylesheet" href="chrome://browser/content/cigale/popup.css">
<link rel="stylesheet" href="chrome://browser/content/cigale/verre/verre-pages.css">
</head>
<body>
  <header>
    <img src="chrome://browser/content/cigale/bouton-barre.png" alt="" width="18" height="18">
    <span class="marque">La Cigale</span>
    <button id="profil" class="profil" title="Changer de profil de protection"></button>
  </header>

  <section class="site">
    <div class="site-texte">
      <p id="etat" class="etat"><i></i><span></span></p>
      <p id="hote" class="hote"></p>
    </div>
    <p id="note" class="note" hidden title=""><b id="note-lettre">A</b><span>note</span></p>
  </section>
  <p id="alerte" class="alerte" hidden></p>

  <section class="chiffres">
    <div><b id="n-traqueurs">0</b><span>traqueurs</span></div>
    <div><b id="n-ublock">0</b><span>requêtes uBlock</span></div>
    <div><b id="n-empreinte">0</b><span>empreintes</span></div>
  </section>
  <p id="certificat" class="certificat"></p>

  <nav>
    <button id="oublier">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span>Oublier<br>ce site</span></button>
    <button id="identite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 11.5-4.2"/><path d="M21 13a4 4 0 1 0-1.2 2.9"/><path d="M21 10v3h-3"/></svg>
      <span>Nouvelle<br>identité</span></button>
    <button id="tor" class="tor">
      <img src="chrome://browser/content/cigale/tor.svg" alt="" width="20" height="20">
      <span>Fenêtre<br>Tor</span></button>
    <button id="fuites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
      <span>Cette<br>page</span></button>
    <button id="propre" title="Copier l'adresse de cette page sans ses paramètres de pistage">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/><path d="m17 17 4 4M21 17l-4 4"/></svg>
      <span>Lien<br>propre</span></button>
    <button id="coffre" title="Ouvrir toujours ce site dans son propre coffre : cookies et connexion à part">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="12" cy="12" r="3"/><path d="M12 9v-.5M12 15.5V15M7 19v1.5M17 19v1.5"/></svg>
      <span id="coffre-texte">Mettre au<br>coffre</span></button>
    <button id="panique" class="panique" title="Tout fermer et tout effacer d'un coup (Ctrl+Maj+F12)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>
      <span id="panique-texte">Panique<small>tout effacer</small></span></button>
  </nav>

  <button id="reglages" class="pied">
    <span>Protection et réglages</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
<script src="chrome://browser/content/cigale/popup.js"></script>
</body>
</html>
