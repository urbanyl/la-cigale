<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src about:; style-src about:; img-src about: data:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<link rel="icon" type="image/png" href="about:sudoku?f=icone.png">
<link rel="stylesheet" href="about:sudoku?f=sudoku.css">
<link rel="stylesheet" href="about:sudoku?f=theme.css">
</head>
<body>
<main class="jeu">
  <header class="entete">
    <div class="marque">
      <img src="about:sudoku?f=symbole.png" alt="">
      <div>
        <span class="surtitre" id="surtitre">Pas de connexion</span>
        <h1>Sudoku</h1>
      </div>
    </div>
    <div class="niveaux" role="radiogroup" aria-label="Difficulté" id="niveaux">
      <button role="radio" data-niveau="facile">Facile</button>
      <button role="radio" data-niveau="moyen">Moyen</button>
      <button role="radio" data-niveau="difficile">Difficile</button>
      <button role="radio" data-niveau="expert">Expert</button>
    </div>
  </header>

  <div class="retour" id="retour" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/></svg>
    <span id="retour-texte">En attente de la connexion</span>
    <a class="bouton" id="retour-lien" href="#">Réessayer la page</a>
  </div>

  <div class="plateau">
    <div class="cadre" id="cadre">
      <div class="grille" id="grille" role="grid" aria-label="Grille de sudoku"></div>
      <div class="voile" id="voile" hidden>
        <div class="voile-pause" id="voile-pause">
          <p class="voile-titre">En pause</p>
          <p class="voile-texte">La grille est cachée et le temps arrêté.</p>
          <button class="bouton plein" id="reprendre">Reprendre</button>
        </div>
        <div class="voile-victoire" id="voile-victoire" hidden>
          <p class="surtitre" id="victoire-niveau">Facile</p>
          <p class="voile-titre">Bravo.</p>
          <p class="voile-texte" id="victoire-texte"></p>
          <div class="voile-actions">
            <button class="bouton plein" id="rejouer">Nouvelle grille</button>
            <button class="bouton" id="plus-dur" hidden>Niveau suivant</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="cote">
      <div class="infos">
        <div><small>Temps</small><b id="temps">0:00</b></div>
        <div><small>Record</small><b id="record">–</b></div>
        <button class="rond" id="pause" title="Pause (P)" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
        </button>
      </div>

      <div class="outils">
        <button class="outil" id="annuler" title="Annuler (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>Annuler</span>
        </button>
        <button class="outil" id="effacer" title="Effacer (Retour arrière)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7M5 11l9 9"/></svg>
          <span>Effacer</span>
        </button>
        <button class="outil" id="notes" title="Notes (N)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.4 3.6a2 2 0 0 1 2.9 2.9L7 18.8l-4 1 1-4Z"/></svg>
          <span>Notes</span><i class="etat" id="notes-etat">non</i>
        </button>
        <button class="outil" id="indice" title="Révéler une case (H)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg>
          <span>Indice</span><i class="etat" id="indice-etat">3</i>
        </button>
      </div>

      <div class="pave" id="pave"></div>

      <button class="bouton plein nouvelle" id="nouvelle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        Nouvelle grille
      </button>
      <p class="aide">Clavier : chiffres, flèches, <kbd>N</kbd> notes, <kbd>Ctrl</kbd> <kbd>Z</kbd> annuler.</p>
    </aside>
  </div>
</main>
<script src="about:sudoku?f=sudoku.js"></script>
</body>
</html>
