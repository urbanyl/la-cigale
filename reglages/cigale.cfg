// ===================================================================== Page d'accueil de La Cigale
// Code exécuté avec les privilèges du navigateur : l'accueil et les nouveaux onglets
// pointent vers cigale/accueil/index.html, livré avec le navigateur (aucune requête réseau).
try {
  let page = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  page.append("cigale");
  page.append("accueil");
  page.append("index.html");
  const urlAccueil = Services.io.newFileURI(page).spec;

  defaultPref("browser.startup.homepage", urlAccueil);
  defaultPref("browser.newtabpage.enabled", true);

  const appliquerNouvelOnglet = () => {
    try {
      const { AboutNewTab } = ChromeUtils.importESModule(
        "resource:///modules/AboutNewTab.sys.mjs"
      );
      if (!Services.prefs.getBoolPref("cigale.nouvelOnglet.natif", false)) {
        AboutNewTab.newTabURL = urlAccueil;
      }
    } catch (e) {
      Components.utils.reportError("La Cigale : nouvel onglet : " + e);
    }
  };
  appliquerNouvelOnglet();
  Services.obs.addObserver(appliquerNouvelOnglet, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("La Cigale : page d'accueil : " + e);
}
