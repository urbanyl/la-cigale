    "@mozilla.org/network/protocol/about;1?what=nouveautes", pageChrome("chrome://browser/content/cigale/nouveautes.html"));
  registre.registerFactory(Components.ID("{a2c84e5b-1d7f-4b36-8e09-5c6f2d4a7b13}"), "about:bienvenue",
    "@mozilla.org/network/protocol/about;1?what=bienvenue", pageChrome("chrome://browser/content/cigale/bienvenue.html"));
