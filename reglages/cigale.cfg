// Page d'accueil : un fichier local (cigale/accueil/index.html), rien ne passe par le réseau
try {
  let page = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  page.append("cigale");
  page.append("accueil");
  page.append("index.html");
  const urlAccueil = Services.io.newFileURI(page).spec;

  defaultPref("browser.startup.homepage", urlAccueil);
  defaultPref("browser.newtabpage.enabled", true);

  const appliquerNouvelOnglet = () => {
    try {
      const { AboutNewTab } = ChromeUtils.importESModule(
        "resource:///modules/AboutNewTab.sys.mjs"
      );
      if (!Services.prefs.getBoolPref("cigale.nouvelOnglet.natif", false)) {
        AboutNewTab.newTabURL = urlAccueil;
      }
    } catch (e) {
      Components.utils.reportError("La Cigale : nouvel onglet : " + e);
    }
  };
  appliquerNouvelOnglet();
  Services.obs.addObserver(appliquerNouvelOnglet, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("La Cigale : page d'accueil : " + e);
}

// about:cigale, bouton de la barre d'outils et avis de mise à jour
try {
  const Ci = Components.interfaces;
  const PAGE_PROTECTION = "chrome://browser/content/cigale/protection.html";

  const fabrique = {
    QueryInterface: ChromeUtils.generateQI(["nsIFactory"]),
    createInstance(iid) {
      return {
        QueryInterface: ChromeUtils.generateQI(["nsIAboutModule"]),
        newChannel(uri, loadInfo) {
          const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(PAGE_PROTECTION), loadInfo);
          canal.originalURI = uri;
          return canal;
        },
        getURIFlags() {
          return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.IS_SECURE_CHROME_UI;
        },
        getChromeURI() {
          return Services.io.newURI(PAGE_PROTECTION);
        },
      }.QueryInterface(iid);
    },
  };
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).registerFactory(
    Components.ID("{4c1a3f0e-8b52-4d6e-9a7c-2f5e1c9b7d30}"), "about:cigale",
    "@mozilla.org/network/protocol/about;1?what=cigale", fabrique);
} catch (e) {
  Components.utils.reportError("La Cigale : about:cigale : " + e);
}

// about:apropos : la page « À propos », servie depuis omni.ja comme une page web ordinaire
// (adresse lisible, retour arrière normal), et about:ouvrir?… pour les boutons de l'accueil.
try {
  const Ci = Components.interfaces;
  const Cr = Components.results;
  const PAGE_APROPOS = "chrome://browser/content/cigale/accueil/apropos.html";
  const registre = Components.manager.QueryInterface(Ci.nsIComponentRegistrar);
  const module = (proprietes) => ({
    QueryInterface: ChromeUtils.generateQI(["nsIFactory"]),
    createInstance(iid) {
      return Object.assign({ QueryInterface: ChromeUtils.generateQI(["nsIAboutModule"]) }, proprietes).QueryInterface(iid);
    },
  });

  registre.registerFactory(Components.ID("{8d2e6b14-3f7a-4c59-b0e1-5a9c4d2f7e61}"), "about:apropos",
    "@mozilla.org/network/protocol/about;1?what=apropos", module({
      newChannel(uri, loadInfo) {
        const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(PAGE_APROPOS), loadInfo);
        canal.originalURI = uri;
        // page ordinaire, sans droits : sinon Firefox refuse de la charger dans un onglet web
        loadInfo.resultPrincipalURI = uri;
        canal.owner = Services.scriptSecurityManager.createContentPrincipal(uri, {});
        return canal;
      },
      getURIFlags() {
        return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.URI_SAFE_FOR_UNTRUSTED_CONTENT;
      },
      getChromeURI() {
        return Services.io.newURI(PAGE_APROPOS);
      },
    }));

  // Seule la page d'accueil (fichier local) peut s'en servir : un site web ne déclenche rien.
  const ACTIONS = {
    protection: (w) => w.switchToTabHavingURI("about:cigale", true),
    preferences: (w) => w.openPreferences(),
    apropos: (w) => w.openTrustedLinkIn("about:apropos", "current"),
    tor: (w) => ChromeUtils.importESModule("chrome://browser/content/cigale/cigale.sys.mjs")
      .ouvrirFenetreTor(w).catch(Components.utils.reportError),
  };
  registre.registerFactory(Components.ID("{2b7f9c31-6e4d-4a8b-9d02-7c1e5f3a8b94}"), "about:ouvrir",
    "@mozilla.org/network/protocol/about;1?what=ouvrir", module({
      newChannel(uri, loadInfo) {
        const origine = loadInfo.triggeringPrincipal;
        const action = ACTIONS[uri.pathQueryRef.split("?")[1]];
        if (action && (origine.isSystemPrincipal || origine.schemeIs("file"))) {
          const w = Services.wm.getMostRecentWindow("navigator:browser");
          if (w) w.setTimeout(() => action(w), 0);
        }
        // la page d'accueil reste affichée
        throw Components.Exception("", Cr.NS_BINDING_ABORTED);
      },
      getURIFlags() {
        return Ci.nsIAboutModule.URI_SAFE_FOR_UNTRUSTED_CONTENT | Ci.nsIAboutModule.HIDE_FROM_ABOUTABOUT;
      },
      getChromeURI() {
        return Services.io.newURI("about:blank");
      },
    }));
} catch (e) {
  Components.utils.reportError("La Cigale : about:apropos : " + e);
}

// Lien d'assistance des préférences : le Discord de La Cigale
const SUPPORT = "https://discord.gg/YFrPQEaQEK";
Services.obs.addObserver((doc) => {
  if (doc.documentURI?.startsWith("about:preferences") || doc.documentURI?.startsWith("about:settings")) {
    const appliquer = () => {
      const lien = doc.getElementById("helpButton");
      if (!lien) return;
      lien.setAttribute("href", SUPPORT);
      lien.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        doc.defaultView.browsingContext.topChromeWindow.openTrustedLinkIn(SUPPORT, "tab");
      }, true);
      // le texte est traduit après coup : on retire l'identifiant de traduction partout
      for (const e of [lien, ...lien.querySelectorAll("[data-l10n-id]")]) e.removeAttribute("data-l10n-id");
      const texte = lien.querySelector(".sidebar-footer-label") || lien;
      texte.textContent = "Assistance (Discord)";
    };
    if (doc.readyState == "loading") doc.addEventListener("DOMContentLoaded", appliquer, { once: true });
    else appliquer();
  }
}, "chrome-document-loaded");

defaultPref("cigale.maj.verifier", true);
let cigaleDemarree = false;
Services.obs.addObserver(function cigaleFenetre(win) {
  if (cigaleDemarree) return;
  cigaleDemarree = true;

  // bouton cigale -> about:cigale
  try {
    let CustomizableUI;
    for (const url of ["moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs",
                       "resource:///modules/CustomizableUI.sys.mjs"]) {
      try { ({ CustomizableUI } = ChromeUtils.importESModule(url)); break; } catch (e) {}
    }
    CustomizableUI.createWidget({
      id: "cigale-protection-button",
      type: "button",
      label: "Protection",
      tooltiptext: "Protection de La Cigale : état et profils de sécurité",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onCommand(evenement) {
        const fenetre = evenement.target.ownerGlobal;
        fenetre.cigaleOngletSource = fenetre.gBrowser.selectedTab;  // pour le rapport de la page
        fenetre.switchToTabHavingURI("about:cigale", true);
      },
    });
    const module = () => ChromeUtils.importESModule("chrome://browser/content/cigale/cigale.sys.mjs");
    CustomizableUI.createWidget({
      id: "cigale-oublier-button",
      type: "button",
      label: "Oublier ce site",
      tooltiptext: "Effacer tout ce que La Cigale garde sur le site ouvert",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onCommand(evenement) {
        module().oublierSite(evenement.target.ownerGlobal).catch(Components.utils.reportError);
      },
    });
    CustomizableUI.createWidget({
      id: "cigale-tor-button",
      type: "button",
      label: "Fenêtre Tor",
      tooltiptext: "Ouvrir une fenêtre qui passe par le réseau Tor",
      defaultArea: CustomizableUI.AREA_FIXED_OVERFLOW_PANEL,
      onCommand(evenement) {
        module().ouvrirFenetreTor(evenement.target.ownerGlobal).catch(Components.utils.reportError);
      },
    });
    const css = `
      #cigale-protection-button { list-style-image: url(chrome://browser/content/cigale/bouton-barre.png); }
      #cigale-oublier-button { list-style-image: url(chrome://browser/skin/forget.svg); }
      #cigale-tor-button { list-style-image: url(chrome://browser/content/cigale/tor.svg); }`;
    const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
      .getService(Components.interfaces.nsIStyleSheetService);
    const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  } catch (e) {
    Components.utils.reportError("La Cigale : bouton : " + e);
  }

  // sans ça, les raccourcis de l'accueil disparaissent à chaque fermeture
  try {
    let page = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    page.append("cigale");
    page.append("accueil");
    page.append("index.html");
    const principal = Services.scriptSecurityManager.createContentPrincipal(Services.io.newFileURI(page), {});
    Services.perms.addFromPrincipal(principal, "cookie", Services.perms.ALLOW_ACTION);
  } catch (e) {
    Components.utils.reportError("La Cigale : stockage de l'accueil : " + e);
  }

  const P = Services.prefs;

  // après une mise à jour, on montre une fois la liste des nouveautés
  const versionActuelle = P.getStringPref("cigale.version", "");
  const versionVue = P.getStringPref("cigale.version.vue", "");
  if (versionActuelle && versionVue != versionActuelle) {
    P.setStringPref("cigale.version.vue", versionActuelle);
    // profil déjà utilisé avant (la 1.1 ne notait pas la version vue)
    if (versionVue || P.prefHasUserValue("cigale.maj.derniere")) {
      // l'ancre #nouveautes se perd à l'ouverture d'about:cigale : la page lit ce réglage
      P.setBoolPref("cigale.nouveautes.afficher", true);
      win.setTimeout(() => win.openTrustedLinkIn("about:cigale", "tab"), 1500);
    }
  }

  if (P.getBoolPref("cigale.tor", false)) {
    const port = P.getIntPref("network.proxy.socks_port", 9150);
    win.setTimeout(() => {
      try {
        win.gNotificationBox.appendNotification("cigale-tor", {
          label: `Fenêtre Tor : tout passe par le réseau Tor (port ${port}). Rien n'est gardé à la fermeture.`,
          priority: win.gNotificationBox.PRIORITY_INFO_MEDIUM,
        });
      } catch (e) {}
    }, 1000);
  }

  // au plus une requête par jour à GitHub
  const DEPOT = "https://github.com/urbanyl/la-cigale/releases/";
  const notifier = (tag) => {
    const version = P.getStringPref("cigale.version", "");
    const propre = tag.replace(/^v/, "");
    if (!version || Services.vc.compare(propre, version) <= 0) return;
    if (P.getStringPref("cigale.maj.ignoree", "") === tag) return;
    try {
      win.gNotificationBox.appendNotification("cigale-maj", {
        label: `La Cigale ${propre} est disponible (vous avez la ${version}).`,
        priority: win.gNotificationBox.PRIORITY_INFO_LOW,
      }, [
        { label: "Télécharger", accessKey: "T",
          callback: () => { win.openTrustedLinkIn(DEPOT + "tag/" + encodeURIComponent(tag), "tab"); } },
        { label: "Ignorer cette version", accessKey: "I",
          callback: () => { P.setStringPref("cigale.maj.ignoree", tag); } },
      ]);
    } catch (e) {
      Components.utils.reportError("La Cigale : notification : " + e);
    }
  };
  win.setTimeout(async () => {
    try {
      if (!P.getBoolPref("cigale.maj.verifier", true)) return;
      const maintenant = Math.floor(Date.now() / 1000);
      if (maintenant - P.getIntPref("cigale.maj.derniere", 0) < 86400) {
        const connue = P.getStringPref("cigale.maj.disponible", "");
        if (connue) notifier(connue);
        return;
      }
      const reponse = await win.fetch("https://api.github.com/repos/urbanyl/la-cigale/releases/latest", {
        credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer",
        headers: { Accept: "application/vnd.github+json" },
      });
      if (!reponse.ok) return;
      const { tag_name: tag } = await reponse.json();
      if (typeof tag !== "string" || !/^v?\d+(\.\d+){0,3}$/.test(tag)) return;
      P.setIntPref("cigale.maj.derniere", maintenant);
      P.setStringPref("cigale.maj.disponible", tag);
      notifier(tag);
    } catch (e) {
      // pas de réseau, tant pis
    }
  }, 15000);
}, "browser-delayed-startup-finished");

// Verrou : demandé avant l'ouverture de la première fenêtre
Services.obs.addObserver(function cigaleVerrou() {
  Services.obs.removeObserver(cigaleVerrou, "final-ui-startup");
  try {
    ChromeUtils.importESModule("chrome://browser/content/cigale/cigale.sys.mjs").demanderMotDePasse();
  } catch (e) {
    Components.utils.reportError("La Cigale : verrou : " + e);
  }
}, "final-ui-startup");

// Fenêtre Tor : un profil à part (« profil-tor », créé par le bouton) qui passe tout par Tor
try {
  const profil = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
  if (profil.leafName.toLowerCase() == "profil-tor") {
    lockPref("cigale.tor", true);
    lockPref("network.proxy.type", 1);
    lockPref("network.proxy.socks", "127.0.0.1");
    defaultPref("network.proxy.socks_port", 9150);   // user.js écrit le bon port (9150 ou 9050)
    lockPref("network.proxy.socks_version", 5);
    lockPref("network.proxy.socks_remote_dns", true);
    lockPref("network.proxy.failover_direct", false);
    lockPref("network.proxy.no_proxies_on", "");
    lockPref("network.trr.mode", 5);                 // le DNS passe par Tor, pas par Quad9
    lockPref("network.dns.disabled", true);
    lockPref("browser.privatebrowsing.autostart", true);
    lockPref("cigale.maj.verifier", false);
    defaultPref("browser.startup.homepage", "https://check.torproject.org/?lang=fr");
    const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
      .getService(Components.interfaces.nsIStyleSheetService);
    const css = "#nav-bar { border-bottom: 2px solid #6f4a8e !important; }";
    sss.loadAndRegisterSheet(Services.io.newURI("data:text/css," + encodeURIComponent(css)), sss.USER_SHEET);
  }
} catch (e) {
  Components.utils.reportError("La Cigale : mode Tor : " + e);
}
