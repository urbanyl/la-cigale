// ===================================================================== Anti-empreinte (niveau Tor Browser)
// resistFingerprinting rend tous les utilisateurs de La Cigale identiques : fuseau UTC,
// polices, canvas, horloges imprécises, etc.
lockPref("privacy.resistFingerprinting", true);
lockPref("privacy.resistFingerprinting.pbmode", true);
// Letterboxing (marges qui arrondissent la zone d'affichage) : désactivé, il gaspille trop
// d'espace à l'écran. La taille de fenêtre redevient un signal ; le réactiver dans about:config
// pour un anonymat maximal façon Tor Browser.
defaultPref("privacy.resistFingerprinting.letterboxing", false);
defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);
// Langue envoyée aux sites : 2 = anglais (anonymat maximal, comme Tor Browser),
// 1 = langue réelle (sites en français, mais signal distinctif). On privilégie l'anonymat.
defaultPref("privacy.spoof_english", 2);
defaultPref("intl.accept_languages", "en-US, en");
defaultPref("javascript.use_us_english_locale", true);
