// Page d'accueil : un fichier local (cigale/accueil/index.html), rien ne passe par le réseau
try {
  let page = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  page.append("cigale");
  page.append("accueil");
  page.append("index.html");
  // resistFingerprinting met les pages en UTC : on passe le vrai fuseau à l'horloge de l'accueil
  let fuseau = "";
  try { fuseau = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  const urlBase = Services.io.newFileURI(page).spec;
  // l'accueil suit le thème (La Cigale, clair, olive) : il le lit dans son adresse (#…&theme=…)
  const themeAccueil = () => ({
    "firefox-compact-light@mozilla.org": "clair",
    "firefox-alpenglow@mozilla.org": "olive",
  })[Services.prefs.getStringPref("extensions.activeThemeID", "")] || "sombre";
  const adresseAccueil = () => urlBase + "#" +
    (fuseau && fuseau !== "UTC" ? "fuseau=" + encodeURIComponent(fuseau) + "&" : "") + "theme=" + themeAccueil();
  let urlAccueil = adresseAccueil();

  defaultPref("browser.startup.homepage", urlAccueil);
  defaultPref("browser.newtabpage.enabled", true);

  const appliquerNouvelOnglet = (fenetre) => {
    try {
      // barre d'adresse vide sur l'accueil : Firefox compare l'adresse sans le #fuseau=…
      if (fenetre && Array.isArray(fenetre.gInitialPages) && !fenetre.gInitialPages.includes(urlBase)) {
        fenetre.gInitialPages.push(urlBase);
      }
      // boutons de l'accueil : la page écrit #…&ouvrir=action dans son adresse
      if (fenetre && fenetre.gBrowser && !fenetre.cigaleBoutonsAccueil) {
        fenetre.cigaleBoutonsAccueil = true;
        fenetre.gBrowser.addTabsProgressListener({
          onLocationChange(navigateur, progression, requete, adresse) {
            try {
              // Retour depuis about:apropos sans page précédente : on charge l'accueil
              if (adresse.spec.startsWith("about:apropos") && /(?:^|&)ouvrir=accueil/.test(adresse.ref)) {
                navigateur.loadURI(Services.io.newURI(urlAccueil), {
                  triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
                });
                return;
              }
              if (adresse.spec.split("#")[0] != urlBase) return;
              const action = (adresse.ref.match(/(?:^|&)ouvrir=([a-z]+)/) || [])[1];
              if (action && typeof cigaleActionAccueil == "function") {
                fenetre.setTimeout(() => cigaleActionAccueil(fenetre, action, navigateur), 0);
              }
            } catch (e) {}
          },
        });
      }
    } catch (e) {}
    try {
      const { AboutNewTab } = ChromeUtils.importESModule(
        "resource:///modules/AboutNewTab.sys.mjs"
      );
      if (!Services.prefs.getBoolPref("cigale.nouvelOnglet.natif", false)) {
        AboutNewTab.newTabURL = urlAccueil;
      }
    } catch (e) {
      Components.utils.reportError("La Cigale : nouvel onglet : " + e);
    }
  };
  appliquerNouvelOnglet();
  Services.obs.addObserver(appliquerNouvelOnglet, "browser-delayed-startup-finished");
  Services.prefs.addObserver("extensions.activeThemeID", () => {
    urlAccueil = adresseAccueil();
    Services.prefs.getDefaultBranch("").setStringPref("browser.startup.homepage", urlAccueil);
    appliquerNouvelOnglet();
  });
} catch (e) {
  Components.utils.reportError("La Cigale : page d'accueil : " + e);
}

// about:cigale, bouton de la barre d'outils et avis de mise à jour
try {
  const Ci = Components.interfaces;
  const PAGE_PROTECTION = "chrome://browser/content/cigale/protection.html";

  const fabrique = {
    QueryInterface: ChromeUtils.generateQI(["nsIFactory"]),
    createInstance(iid) {
      return {
        QueryInterface: ChromeUtils.generateQI(["nsIAboutModule"]),
        newChannel(uri, loadInfo) {
          const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(PAGE_PROTECTION), loadInfo);
          canal.originalURI = uri;
          return canal;
        },
        getURIFlags() {
          return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.IS_SECURE_CHROME_UI;
        },
        getChromeURI() {
          return Services.io.newURI(PAGE_PROTECTION);
        },
      }.QueryInterface(iid);
    },
  };
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).registerFactory(
    Components.ID("{4c1a3f0e-8b52-4d6e-9a7c-2f5e1c9b7d30}"), "about:cigale",
    "@mozilla.org/network/protocol/about;1?what=cigale", fabrique);

  // about:nouveautes (après une mise à jour) et about:bienvenue (premier lancement)
  const pageChrome = (chemin) => ({
    QueryInterface: ChromeUtils.generateQI(["nsIFactory"]),
    createInstance(iid) {
      return {
        QueryInterface: ChromeUtils.generateQI(["nsIAboutModule"]),
        newChannel(uri, loadInfo) {
          const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(chemin), loadInfo);
          canal.originalURI = uri;
          return canal;
        },
        getURIFlags() {
          return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.IS_SECURE_CHROME_UI;
        },
        getChromeURI() {
          return Services.io.newURI(chemin);
        },
      }.QueryInterface(iid);
    },
  });
