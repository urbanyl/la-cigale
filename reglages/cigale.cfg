// about:apropos : la page « À propos », servie depuis omni.ja comme une page web ordinaire
// (adresse lisible, retour arrière normal), et about:ouvrir?… pour les boutons de l'accueil.
try {
  const Ci = Components.interfaces;
  const Cr = Components.results;
  const PAGE_APROPOS = "chrome://browser/content/cigale/accueil/apropos.html";
  const registre = Components.manager.QueryInterface(Ci.nsIComponentRegistrar);
  const module = (proprietes) => ({
    QueryInterface: ChromeUtils.generateQI(["nsIFactory"]),
    createInstance(iid) {
      return Object.assign({ QueryInterface: ChromeUtils.generateQI(["nsIAboutModule"]) }, proprietes).QueryInterface(iid);
    },
  });

  registre.registerFactory(Components.ID("{8d2e6b14-3f7a-4c59-b0e1-5a9c4d2f7e61}"), "about:apropos",
    "@mozilla.org/network/protocol/about;1?what=apropos", module({
      newChannel(uri, loadInfo) {
        // about:apropos?f=style.css… : les fichiers de la page (les liens relatifs ne marchent pas sous about:)
        const FICHIERS = ["style.css", "apropos.js", "img/favicon.png", "img/symbole-blanc.webp", "img/fond.jpg"];
        const demande = decodeURIComponent((uri.pathQueryRef.match(/[?&]f=([^&#]+)/) || [])[1] || "");
        const cible = FICHIERS.includes(demande) ? PAGE_APROPOS.replace("apropos.html", demande) : PAGE_APROPOS;
        const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(cible), loadInfo);
        canal.originalURI = uri;
        // page ordinaire, sans droits : sinon Firefox refuse de la charger dans un onglet web
        loadInfo.resultPrincipalURI = uri;
        canal.owner = Services.scriptSecurityManager.createContentPrincipal(uri, {});
        return canal;
      },
      getURIFlags() {
        return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.URI_SAFE_FOR_UNTRUSTED_CONTENT;
      },
      getChromeURI() {
        return Services.io.newURI(PAGE_APROPOS);
      },
    }));

  // about:sudoku : le jeu proposé par la page « pas de connexion », page ordinaire sans droits
  const SUDOKU = "chrome://browser/content/cigale/";
  const FICHIERS_SUDOKU = {
    "sudoku.css": "sudoku/sudoku.css",
    "sudoku.js": "sudoku/sudoku.js",
    "bricolage.woff2": "accueil/polices/bricolage-latin.woff2",
    "fond.jpg": "accueil/img/fond.jpg",
    "fond-clair.jpg": "accueil/img/fond-clair.jpg",
    "fond-olive.jpg": "accueil/img/fond-olive.jpg",
    "icone.png": "bouton.png",
    "symbole.png": "bouton-barre.png",
  };
  registre.registerFactory(Components.ID("{5e9b1c47-2a6d-4f83-b7c0-9d4e3a1f6b28}"), "about:sudoku",
    "@mozilla.org/network/protocol/about;1?what=sudoku", module({
      newChannel(uri, loadInfo) {
        const demande = decodeURIComponent((uri.pathQueryRef.match(/[?&]f=([^&#]+)/) || [])[1] || "");
        let cible = FICHIERS_SUDOKU[demande] || "sudoku/sudoku.html";
        // le thème Olive n'est pas visible d'une page ordinaire : on lui sert ses couleurs
        if (demande == "theme.css") {
          const olive = Services.prefs.getStringPref("extensions.activeThemeID", "") == "firefox-alpenglow@mozilla.org";
          cible = olive ? "sudoku/theme-olive.css" : "sudoku/theme-aucun.css";
        }
        const canal = Services.io.newChannelFromURIWithLoadInfo(Services.io.newURI(SUDOKU + cible), loadInfo);
        canal.originalURI = uri;
        loadInfo.resultPrincipalURI = uri;
        canal.owner = Services.scriptSecurityManager.createContentPrincipal(uri, {});
        return canal;
      },
      getURIFlags() {
        // ENABLE_INDEXED_DB : stockage local (partie en cours, records)
        return Ci.nsIAboutModule.ALLOW_SCRIPT | Ci.nsIAboutModule.URI_SAFE_FOR_UNTRUSTED_CONTENT |
          Ci.nsIAboutModule.ENABLE_INDEXED_DB;
      },
      getChromeURI() {
        return Services.io.newURI(SUDOKU + "sudoku/sudoku.html");
      },
    }));

  // Seule la page d'accueil (fichier local exact) peut s'en servir : un site web ne déclenche rien.
  const pageAccueil = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  pageAccueil.append("cigale");
  pageAccueil.append("accueil");
  pageAccueil.append("index.html");
  const urlAccueil = Services.io.newFileURI(pageAccueil).spec;
  const ACTIONS = {
    protection: (w) => w.switchToTabHavingURI("about:cigale", true),
    bilan: (w) => w.switchToTabHavingURI("about:cigale#bilan", true, { ignoreFragment: "whenComparingAndReplace" }),
    preferences: (w) => w.openPreferences(),
    apropos: (w) => w.openTrustedLinkIn("about:apropos", "current"),
    tor: (w) => ChromeUtils.importESModule("chrome://browser/content/cigale/cigale.sys.mjs")
      .ouvrirFenetreTor(w).catch(Components.utils.reportError),
  };
  // Apparence choisie sur l'accueil : tout le navigateur change de thème, haut de la fenêtre compris
  const THEMES_ACCUEIL = {
    themesombre: "firefox-compact-dark@mozilla.org",
    themeclair: "firefox-compact-light@mozilla.org",
    themeolive: "firefox-alpenglow@mozilla.org",
  };
  for (const [action, ident] of Object.entries(THEMES_ACCUEIL)) {
    ACTIONS[action] = () => {
      const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
      AddonManager.getAddonByID(ident).then((theme) => theme && theme.enable()).catch(Components.utils.reportError);
    };
  }
  cigaleActions = ACTIONS;
  registre.registerFactory(Components.ID("{2b7f9c31-6e4d-4a8b-9d02-7c1e5f3a8b94}"), "about:ouvrir",
    "@mozilla.org/network/protocol/about;1?what=ouvrir", module({
      newChannel(uri, loadInfo) {
        const origine = loadInfo.triggeringPrincipal;
        const action = ACTIONS[uri.pathQueryRef.split("?")[1]];
        const origineSpec = origine && origine.spec ? origine.spec.split("#")[0] : "";
        const autorise = (origine && origine.isSystemPrincipal) || origineSpec === urlAccueil;
        if (action && autorise) {
          const w = Services.wm.getMostRecentWindow("navigator:browser");
          if (w) w.setTimeout(() => action(w), 0);
        }
        // la page d'accueil reste affichée
        throw Components.Exception("", Cr.NS_BINDING_ABORTED);
      },
      getURIFlags() {
        return Ci.nsIAboutModule.URI_SAFE_FOR_UNTRUSTED_CONTENT | Ci.nsIAboutModule.HIDE_FROM_ABOUTABOUT;
      },
      getChromeURI() {
        return Services.io.newURI("about:blank");
      },
    }));
} catch (e) {
  Components.utils.reportError("La Cigale : about:apropos : " + e);
}

// Lien d'assistance des préférences : le Discord de La Cigale
const SUPPORT = "https://discord.gg/YFrPQEaQEK";
Services.obs.addObserver((doc) => {
  if (doc.documentURI?.startsWith("about:preferences") || doc.documentURI?.startsWith("about:settings")) {
    // couleurs de about:cigale
    const feuille = doc.createElementNS("http://www.w3.org/1999/xhtml", "link");
    feuille.rel = "stylesheet";
    feuille.href = "chrome://browser/content/cigale/preferences.css";
    (doc.head || doc.documentElement).append(feuille);
    const appliquer = () => {
      const lien = doc.getElementById("helpButton");
      if (!lien) return;
      lien.setAttribute("href", SUPPORT);
      lien.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        doc.defaultView.browsingContext.topChromeWindow.openTrustedLinkIn(SUPPORT, "tab");
      }, true);
      // le texte est traduit après coup : on retire l'identifiant de traduction partout
      for (const e of [lien, ...lien.querySelectorAll("[data-l10n-id]")]) e.removeAttribute("data-l10n-id");
      const texte = lien.querySelector(".sidebar-footer-label") || lien;
      texte.textContent = "Assistance (Discord)";
    };
    // Vie privée : un interrupteur unique pour l'effacement à la fermeture
    const PREF_FERMETURE = "privacy.sanitize.sanitizeOnShutdown";
    const fermeture = () => {
      if (doc.getElementById("cigale-fermeture")) return true;
      const section = doc.querySelector('setting-pane[data-category="panePrivacy"] > section')
        || doc.getElementById("deleteOnClose")?.closest("setting-group")?.parentElement;
      if (!section) return false;
      const carte = doc.createElement("moz-card");
      carte.id = "cigale-fermeture";
      carte.style.marginBlockEnd = "24px";
      const bascule = doc.createElement("moz-toggle");
      bascule.setAttribute("label", "Tout effacer à la fermeture");
      bascule.setAttribute("description", "Historique, cookies, cache et formulaires sont supprimés quand vous fermez La Cigale. "
        + "Désactivez pour rester connecté à vos sites et garder votre historique.");
      const lire = () => { bascule.pressed = Services.prefs.getBoolPref(PREF_FERMETURE, true); };
      lire();
      bascule.addEventListener("toggle", () => {
        const actif = bascule.pressed;
        Services.prefs.setBoolPref(PREF_FERMETURE, actif);
        // réactiver remet aussi les cookies dans l'effacement
        if (actif) Services.prefs.setBoolPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);
      });
      const observateur = { observe: lire };
      Services.prefs.addObserver(PREF_FERMETURE, observateur);
      doc.defaultView.addEventListener("unload", () => Services.prefs.removeObserver(PREF_FERMETURE, observateur), { once: true });
      carte.append(bascule);
      section.prepend(carte);
      return true;
    };
    // le panneau Vie privée est construit quand on l'ouvre : on surveille la page
    const attendre = () => {
      fermeture();
      new doc.defaultView.MutationObserver(() => fermeture()).observe(doc.documentElement, { childList: true, subtree: true });
    };
    if (doc.readyState == "loading") doc.addEventListener("DOMContentLoaded", () => { appliquer(); attendre(); }, { once: true });
    else { appliquer(); attendre(); }
  }
}, "chrome-document-loaded");

defaultPref("cigale.maj.verifier", true);
let cigaleDemarree = false;
Services.obs.addObserver(function cigaleFenetre(win) {
  if (cigaleDemarree) return;
  cigaleDemarree = true;

  // bouton cigale -> about:cigale
  try {
    let CustomizableUI;
    for (const url of ["moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs",
                       "resource:///modules/CustomizableUI.sys.mjs"]) {
      try { ({ CustomizableUI } = ChromeUtils.importESModule(url)); break; } catch (e) {}
    }
    // bouton cigale : un panneau (popup.html) avec l'état du site ouvert et les raccourcis
    CustomizableUI.createWidget({
      id: "cigale-protection-button",
      type: "view",
      viewId: "PanelUI-cigale",
      label: "Protection",
      tooltiptext: "Protection de La Cigale",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onBeforeCreated(doc) {
        if (doc.getElementById("PanelUI-cigale")) return;
        const vue = doc.createXULElement("panelview");
        vue.id = "PanelUI-cigale";
        const cadre = doc.createElementNS("http://www.w3.org/1999/xhtml", "iframe");
        cadre.id = "PanelUI-cigale-cadre";
        cadre.setAttribute("src", "chrome://browser/content/cigale/popup.html");
        cadre.style.cssText = "width: 340px; height: 330px; border: 0; display: block;";
        vue.append(cadre);
        doc.getElementById("appMenu-viewCache").append(vue);
      },
      onViewShowing(evenement) {
        const cadre = evenement.target.querySelector("#PanelUI-cigale-cadre");
        try { cadre.contentWindow.cigaleRafraichir(); } catch (e) {}
      },
    });
    const module = () => ChromeUtils.importESModule("chrome://browser/content/cigale/cigale.sys.mjs");
    CustomizableUI.createWidget({
      id: "cigale-oublier-button",
      type: "button",
      label: "Oublier ce site",
      tooltiptext: "Effacer tout ce que La Cigale garde sur le site ouvert",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onCommand(evenement) {
        module().oublierSite(evenement.target.ownerGlobal).catch(Components.utils.reportError);
      },
    });
    CustomizableUI.createWidget({
      id: "cigale-tor-button",
      type: "button",
      label: "Fenêtre Tor",
      tooltiptext: "Ouvrir une fenêtre qui passe par le réseau Tor",
      defaultArea: CustomizableUI.AREA_FIXED_OVERFLOW_PANEL,
      onCommand(evenement) {
        module().ouvrirFenetreTor(evenement.target.ownerGlobal).catch(Components.utils.reportError);
      },
    });
    const css = `
      #cigale-protection-button { list-style-image: url(chrome://browser/content/cigale/bouton-barre.svg); -moz-context-properties: fill, fill-opacity; fill: currentColor; }
      #cigale-oublier-button { list-style-image: url(chrome://browser/skin/forget.svg); }
      #cigale-tor-button { list-style-image: url(chrome://browser/content/cigale/tor.svg); }`;
    const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
      .getService(Components.interfaces.nsIStyleSheetService);
    const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  } catch (e) {
    Components.utils.reportError("La Cigale : bouton : " + e);
  }

  // sans ça, les raccourcis de l'accueil disparaissent à chaque fermeture
  try {
    let page = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
    page.append("cigale");
    page.append("accueil");
    page.append("index.html");
    const principal = Services.scriptSecurityManager.createContentPrincipal(Services.io.newFileURI(page), {});
    Services.perms.addFromPrincipal(principal, "cookie", Services.perms.ALLOW_ACTION);
  } catch (e) {
    Components.utils.reportError("La Cigale : stockage de l'accueil : " + e);
  }

  const P = Services.prefs;

  // après une mise à jour, on montre une fois la liste des nouveautés
  const versionActuelle = P.getStringPref("cigale.version", "");
  const versionVue = P.getStringPref("cigale.version.vue", "");
  const branche = (v) => v.split(".").slice(0, 2).join(".");
  const dejaUtilise = !!versionVue || P.prefHasUserValue("cigale.maj.derniere");
  if (versionActuelle && versionVue != versionActuelle) {
    P.setStringPref("cigale.version.vue", versionActuelle);
    // profil déjà utilisé avant (la 1.1 ne notait pas la version vue) ; rien pour un simple correctif (1.3.0 → 1.3.1)
    if (dejaUtilise && branche(versionVue) != branche(versionActuelle)) {
      win.setTimeout(() => win.openTrustedLinkIn("about:nouveautes", "tab"), 1500);
    }
  }
  // tout premier lancement (pas une fenêtre Tor) : la bienvenue en trois étapes
  if (!dejaUtilise && !P.getBoolPref("cigale.bienvenue.vue", false) && !P.getBoolPref("cigale.tor", false)) {
    P.setBoolPref("cigale.bienvenue.vue", true);
    win.setTimeout(() => {
      const g = win.gBrowser;
      const t = g.addTrustedTab("about:bienvenue");
      g.selectedTab = t;
    }, 1200);
  }

  if (P.getBoolPref("cigale.tor", false)) {
    const port = P.getIntPref("network.proxy.socks_port", 9150);
    win.setTimeout(() => {
      try {
        win.gNotificationBox.appendNotification("cigale-tor", {
          label: `Fenêtre Tor : tout passe par le réseau Tor (port ${port}). Rien n'est gardé à la fermeture.`,
          priority: win.gNotificationBox.PRIORITY_INFO_MEDIUM,
        });
      } catch (e) {}
    }, 1000);
  }

  // au plus une requête par jour à GitHub
  const DEPOT = "https://github.com/urbanyl/la-cigale/releases/";
  const notifier = (tag) => {
    const version = P.getStringPref("cigale.version", "");
    const propre = tag.replace(/^v/, "");
    if (!version || Services.vc.compare(propre, version) <= 0) return;
    if (P.getStringPref("cigale.maj.ignoree", "") === tag) return;
    try {
      win.gNotificationBox.appendNotification("cigale-maj", {
        label: `La Cigale ${propre} est disponible (vous avez la ${version}).`,
        priority: win.gNotificationBox.PRIORITY_INFO_LOW,
      }, [
        ...(Services.appinfo.OS == "WINNT" ? [{ label: "Mettre à jour", accessKey: "M",
          callback: () => { mettreAJour(propre); return true; } }] : []),
        { label: "Télécharger", accessKey: "T",
          callback: () => { win.openTrustedLinkIn(DEPOT + "tag/" + encodeURIComponent(tag), "tab"); } },
        { label: "Ignorer cette version", accessKey: "I",
          callback: () => { P.setStringPref("cigale.maj.ignoree", tag); } },
      ]);
    } catch (e) {
      Components.utils.reportError("La Cigale : notification : " + e);
    }
  };
  // Windows : télécharge l'installeur, vérifie son empreinte SHA-256 publiée, le lance,
  // puis ferme La Cigale pour qu'il la remplace.
  const empreinteSha256 = (octets) => {
    const hache = Components.classes["@mozilla.org/security/hash;1"]
      .createInstance(Components.interfaces.nsICryptoHash);
    hache.init(Components.interfaces.nsICryptoHash.SHA256);
    hache.update(octets, octets.length);
    return Array.from(hache.finish(false), (c) => c.charCodeAt(0).toString(16).padStart(2, "0")).join("");
  };
  const mettreAJour = async (propre) => {
    const barre = win.gNotificationBox;
    const afficher = (label, priorite) => {
      try {
        barre.getNotificationWithValue("cigale-maj")?.close();
        barre.appendNotification("cigale-maj", { label, priority: priorite ?? barre.PRIORITY_INFO_LOW });
      } catch (e) {}
    };
    try {
      afficher(`Téléchargement de La Cigale ${propre}…`);
      const nom = `LaCigale-${propre}-windows-x64-installeur.exe`;
      const options = { credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer" };
      const [reponse, manifeste] = await Promise.all([
        win.fetch(`${DEPOT}download/v${propre}/${nom}`, options),
        win.fetch(`${DEPOT}download/v${propre}/SHA256SUMS.txt`, options),
      ]);
      if (!reponse.ok) throw new Error("HTTP " + reponse.status);
      if (!manifeste.ok) throw new Error("empreintes indisponibles");
      const octets = new Uint8Array(await reponse.arrayBuffer());
      const lignes = (await manifeste.text()).split(/\r?\n/);
      const ligne = lignes.find((l) => l.trim().split(/\s+/).pop() === nom);
      if (!ligne) throw new Error("empreinte absente du manifeste");
      const attendu = ligne.trim().split(/\s+/)[0].toLowerCase();
      const obtenu = empreinteSha256(octets);
      if (!/^[0-9a-f]{64}$/.test(attendu) || obtenu !== attendu) {
        throw new Error("empreinte SHA-256 incorrecte");
      }
      afficher(`Empreinte vérifiée, installation de La Cigale ${propre}…`);
      const chemin = win.PathUtils.join(win.PathUtils.tempDir, nom);
      await win.IOUtils.write(chemin, octets);
      const exe = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
      exe.initWithPath(chemin);
      const processus = Components.classes["@mozilla.org/process/util;1"].createInstance(Components.interfaces.nsIProcess);
      processus.init(exe);
      processus.runw(false, [], 0);
      afficher("L'installeur est lancé, La Cigale va se fermer.");
      win.setTimeout(() => Services.startup.quit(Services.startup.eAttemptQuit), 2000);
    } catch (e) {
      Components.utils.reportError("La Cigale : mise à jour : " + e);
      afficher("La mise à jour a échoué (téléchargement ou empreinte non vérifiée). Téléchargez-la depuis la page des versions.", barre.PRIORITY_WARNING_LOW);
      win.openTrustedLinkIn(DEPOT + "latest", "tab");
    }
  };
  win.setTimeout(async () => {
    try {
      if (!P.getBoolPref("cigale.maj.verifier", true)) return;
      const maintenant = Math.floor(Date.now() / 1000);
      if (maintenant - P.getIntPref("cigale.maj.derniere", 0) < 86400) {
        const connue = P.getStringPref("cigale.maj.disponible", "");
        if (connue) notifier(connue);
        return;
      }
      const reponse = await win.fetch("https://api.github.com/repos/urbanyl/la-cigale/releases/latest", {
        credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer",
        headers: { Accept: "application/vnd.github+json" },
      });
      if (!reponse.ok) return;
      const { tag_name: tag } = await reponse.json();
      if (typeof tag !== "string" || !/^v?\d+(\.\d+){0,3}$/.test(tag)) return;
      P.setIntPref("cigale.maj.derniere", maintenant);
      P.setStringPref("cigale.maj.disponible", tag);
      notifier(tag);
    } catch (e) {
      // pas de réseau, tant pis
    }
  }, 15000);
}, "browser-delayed-startup-finished");

// Changement de version : vider le cache des scripts au prochain démarrage (filet de sécurité
// si l'installeur n'a pas pu le faire, par exemple version portable)
try {
  const vu = Services.prefs.getStringPref("cigale.version.cache", "");
  const actuelle = Services.prefs.getStringPref("cigale.version", "");
  if (actuelle && vu != actuelle) {
    Services.prefs.setStringPref("cigale.version.cache", actuelle);
    if (vu) Services.appinfo.invalidateCachesOnRestart();
  }
} catch (e) {}

// Après une mise à jour : supprimer les installeurs téléchargés des versions précédentes
Services.obs.addObserver(function cigaleNettoyerMaj() {
  Services.obs.removeObserver(cigaleNettoyerMaj, "browser-delayed-startup-finished");
  (async () => {
    const dossier = PathUtils.tempDir;
    for (const chemin of await IOUtils.getChildren(dossier)) {
      if (/^LaCigale-[\d.]+-windows-x64-installeur\.exe$/i.test(PathUtils.filename(chemin))) {
        await IOUtils.remove(chemin).catch(() => {});   // encore ouvert : il partira la fois suivante
      }
    }
  })().catch(() => {});
}, "browser-delayed-startup-finished");

