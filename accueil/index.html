<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouvel onglet — La Cigale</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <header class="entete">
      <img class="symbole" src="img/symbole-blanc.webp" alt="" width="44" height="44">
      <div>
        <p class="salut" id="salut">Bonjour</p>
        <p class="date" id="date"></p>
      </div>
      <time class="heure" id="heure">--:--</time>
    </header>

    <form class="recherche" id="recherche" role="search" autocomplete="off">
      <label class="visuellement-cache" for="q">Rechercher sur le Web</label>
      <input id="q" name="q" type="search" placeholder="Rechercher ou saisir une adresse" autofocus>
      <div class="moteur">
        <button type="button" class="moteur-bouton" id="moteur-bouton"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="moteur-liste">
          <span class="visuellement-cache">Moteur de recherche : </span>
          <span id="moteur-nom">DuckDuckGo</span>
          <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="moteur-liste" id="moteur-liste" role="listbox" tabindex="-1"
            aria-label="Moteur de recherche" hidden>
          <li role="option" data-valeur="ddg">DuckDuckGo</li>
          <li role="option" data-valeur="qwant">Qwant</li>
          <li role="option" data-valeur="startpage">Startpage</li>
          <li role="option" data-valeur="lilo">Lilo</li>
          <li role="option" data-valeur="wikipedia">Wikipédia</li>
        </ul>
      </div>
      <button type="submit" aria-label="Lancer la recherche">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <section aria-labelledby="titre-raccourcis">
      <div class="barre-section">
        <h2 id="titre-raccourcis">Raccourcis</h2>
        <button class="lien" id="modifier" type="button">Modifier</button>
      </div>
      <ul class="raccourcis" id="raccourcis"></ul>
      <form class="ajout" id="ajout" hidden>
        <input id="ajout-nom" placeholder="Nom" required maxlength="24">
        <input id="ajout-url" placeholder="https://…" required type="url">
        <button type="submit">Ajouter</button>
        <button type="button" class="lien" id="reinitialiser">Réinitialiser</button>
        <p class="note">Par souci d'anonymat, vos raccourcis sont effacés à la fermeture du navigateur.</p>
      </form>
    </section>

    <footer class="pied">
      <a href="apropos.html">À propos</a>
    </footer>
  </main>
  <script src="accueil.js"></script>
</body>
</html>
